name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  hit-api-gateway:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Hit API Gateway
      run: |
        curl -X POST https://api-gateway-endpoint.com/endpoint \
        -H "Content-Type: application/json" \
        -d '{"repo": "${{ github.repository }}", "source_system": "your-source-system", "github_folder": "your-github-folder"}' \
        -o response.json

    - name: Parse API response
      id: parse_response
      run: |
        company_name=$(jq -r '.company_name' response.json)
        source_system=$(jq -r '.source_system' response.json)
        converted_queries=$(jq -r '.converted_queries' response.json)
        echo "::set-output name=company_name::$company_name"
        echo "::set-output name=source_system::$source_system"
        echo "::set-output name=converted_queries::$converted_queries"

    - name: Create folder structure and store results
      run: |
        company_name="${{ steps.parse_response.outputs.company_name }}"
        source_system="${{ steps.parse_response.outputs.source_system }}"
        mkdir -p "$company_name/$source_system/Results"
        echo "${{ steps.parse_response.outputs.converted_queries }}" > "$company_name/$source_system/Results/queries.txt"

    - name: Install Databricks CLI
      run: pip install databricks-cli

    - name: Configure Databricks CLI
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        databricks configure --token <<EOF
        $DATABRICKS_HOST
        $DATABRICKS_TOKEN
        EOF

    - name: Update Databricks Repo
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        repo_id=$(databricks repos list --path /Repos/your-repo-path | jq -r '.repos[] | select(.path == "/Repos/your-repo-path") | .id')
        if [ -z "$repo_id" ]; then
          echo "Repo not found"
          exit 1
        fi
        curl -X PATCH "$DATABRICKS_HOST/api/2.0/repos/$repo_id" \
        -H "Authorization: Bearer $DATABRICKS_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"branch": "main"}'
